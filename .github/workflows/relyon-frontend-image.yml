name: Relyon frontend image

# Builds the planning-enabled frontend and publishes it to GHCR for the Relyon VPS.
# Manual or on pushes to the planning branch only; does not touch upstream deploy workflows.
on:
  workflow_dispatch:
  push:
    branches: [relyon/project-planning, relyon/native-planning]
    paths: ["frontend/**", ".github/workflows/relyon-frontend-image.yml"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/relyondev/agenticos-frontend:1.38.2-planning.5
            ghcr.io/relyondev/agenticos-frontend:planning-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
